<script>
(function () {
  'use strict';
  function rngFrom(seed){let a=(Number(seed)||0)>>>0;return ()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
  const round=(v,n=3)=>Number(v.toFixed(n));
  const choose=(arr,rand)=>arr[Math.floor(rand()*arr.length)];
  const sectors=['water','climate','hospitality','real estate','community','transport','health','education','music','waste'];
  const vehicles=['tool','marketplace','dataset','subscription','collaboration','workflow'];
  const tactics=['cost visibility','trust','scheduling','discovery','translation','matching','prevention','forecasting'];
  function* parallax(seed){
    const rand=rngFrom(seed);
    yield {stage:'INITIALISE',msg:`Seed ${seed}. Preparing 50 synthetic opportunity combinations.`,progress:.04};
    const items=[];
    for(let i=0;i<50;i++){
      items.push({id:'PX-'+String(i+1).padStart(3,'0'),sector:choose(sectors,rand),vehicle:choose(vehicles,rand),tactic:choose(tactics,rand),demand:rand(),fit:rand(),novelty:rand(),feasibility:rand(),cost:rand(),risk:rand()});
      if((i+1)%10===0)yield {stage:'GENERATE',msg:`Generated ${i+1}/50 candidate combinations.`,progress:.06+(i+1)/50*.23,viz:[(i+1)/50]};
    }
    for(const v of items){v.score=round(100*(.29*v.demand+.25*v.fit+.22*v.feasibility+.17*v.novelty+.07*(1-v.cost))*(1-.25*v.risk),2);}
    const ordered=[...items].sort((a,b)=>b.score-a.score);
    yield {stage:'WEIGHT',msg:`Scored 50 combinations. Best synthetic score: ${ordered[0].score}/100.`,progress:.45,viz:ordered.slice(0,16).map(x=>x.score/100)};
    const pool=[...ordered],shortlist=[];
    while(shortlist.length<8){
      let pick=pool[0],best=-1;
      for(const candidate of pool){
        const similarity=shortlist.length?Math.max(...shortlist.map(prev=>(Number(prev.sector===candidate.sector)+Number(prev.vehicle===candidate.vehicle)+Number(prev.tactic===candidate.tactic))/3)):0;
        const adjusted=.74*candidate.score+.26*(100*(1-similarity));
        if(adjusted>best){best=adjusted;pick=candidate;}
      }
      shortlist.push(pick);pool.splice(pool.indexOf(pick),1);
      yield {stage:'DIVERSIFY',msg:`Selected ${pick.id}: ${pick.sector} ${pick.vehicle} / ${pick.tactic} [${pick.score}]`,progress:.48+shortlist.length*.061,viz:shortlist.map(x=>x.score/100)};
    }
    yield {stage:'ARCHIVE',msg:'Shortlist committed to local run record. No market evidence was gathered.',progress:1};
    return {title:'Candidate shortlist',summary:'8 synthetic concept combinations selected from 50. Scores are computed from invented input dimensions, not customer or market evidence.',items:shortlist.map(x=>({label:`${x.sector.toUpperCase()} ${x.vehicle}`,value:x.score.toFixed(1),detail:`${x.id} · ${x.tactic} · synthetic criteria`})),meta:{generated:50,shortlisted:8,seed}};
  }
  const genes=[['spiral','lattice','fold','ring','filament','mesh'],['signal','tide','sound','light','heat','flow'],['couple','invert','store','filter','repeat','reflect'],['glass','sand','water','silk','basalt','copper']];
  function* lhundrup(seed){
    const rand=rngFrom(seed),num=arr=>Math.floor(rand()*arr.length);
    const table=genes.map(g=>g.map(()=>rand()));
    const scoreQuality=gen=>gen.reduce((s,v,i)=>s+table[i][v],0)/gen.length;
    const archive=[];
    const novelty=gen=>{if(!archive.length)return 1;const ds=archive.map(prev=>gen.reduce((s,g,i)=>s+Number(g!==prev[i]),0)/gen.length).sort((a,b)=>a-b).slice(0,5);return ds.reduce((s,n)=>s+n,0)/ds.length;};
    let pop=Array.from({length:20},()=>genes.map(g=>num(g)));let best=null;
    yield {stage:'ORIGIN',msg:`Seed ${seed}. Twenty four-part structures initialized.`,progress:.03,viz:[.1,.2,.3]};
    for(let gen=0;gen<6;gen++){
      const scored=pop.map(g=>({g,q:scoreQuality(g),n:novelty(g)})).map(s=>({...s,fitness:round(.55*s.n+.45*s.q)})).sort((a,b)=>b.fitness-a.fitness);
      if(!best||scored[0].fitness>best.fitness)best=scored[0];
      scored.slice(0,5).forEach(x=>archive.push([...x.g]));
      const count=new Set(archive.map(v=>v.join(','))).size;
      yield {stage:`GEN ${gen+1}`,msg:`Best quality ${round(scored[0].q)} / novelty ${round(scored[0].n)}. Archive: ${count} unique forms.`,progress:.07+(gen+1)/6*.84,viz:scored.map(x=>x.fitness),detail:{generation:gen+1,unique:count}};
      const elite=scored.slice(0,9);
      pop=Array.from({length:20},()=>{const a=choose(elite,rand).g,b=choose(elite,rand).g;return a.map((x,i)=>rand()<.18?num(genes[i]):rand()<.5?x:b[i]);});
    }
    const final=best.g.map((v,i)=>genes[i][v]).join(' · ');
    yield {stage:'CONVERGE',msg:'Local selection complete. Generated mechanisms are untested creative combinations.',progress:1,viz:best.g.map(g=>g/5)};

function stop(){if(state.run?.status==='running')state.run.control.abort();}
function downloadRun(id){const r=state.history.find(x=>x.id===id)||state.run;if(!r?.result){toast('No completed result available.');return;}const exportable={app:'THE ARRAY',provenance:'BROWSER LOCAL / SYNTHETIC',...r};delete exportable.control;const data=new Blob([JSON.stringify(exportable,null,2)],{type:'application/json'}),u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=`array-${r.machine}-${r.seed}-${r.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2500);}
function action(e){const b=e.target.closest('[data-action]');if(!b)return;const name=b.dataset.action,id=b.dataset.id;e.stopPropagation();switch(name){case'navigate':navigate(b.dataset.to);break;case'open':navigate('machine/'+id);break;case'go':navigate('machine/'+id);setTimeout(()=>start(id),0);break;case'start':start(id);break;case'stop':stop();break;case'filter':document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));el('#machine-list').innerHTML=machineRows(b.dataset.filter);A.mountAll();break;case'export':downloadRun(b.dataset.run);break;case'view-activity':navigate('run/'+state.run?.id);break;case'history':navigate('run/'+id);break;case'clear-history':if(confirm('Erase saved local run history from this browser?')){state.history=[];save(HISTORY,[]);render();toast('Local history cleared.');}break;case'reset-settings':state.prefs={...defaults};save(KEY,state.prefs);document.body.classList.remove('reduce-motion');render();toast('Settings restored.');break;}}
function settingsChanged(e){const t=e.target;if(t.id==='reduce-motion')state.prefs.reduceMotion=t.checked;else if(t.id==='speed')state.prefs.stepMs=Number(t.value);else if(t.id==='global-seed')state.prefs.seed=Math.trunc(Number(t.value)||0);else if(t.id==='neuro-cycles')state.prefs.neuroCycles=Number(t.value);else if(t.id==='neuro-phase')state.prefs.neuroPhase=Number(t.value);else if(t.id==='run-seed')state.prefs.seed=Math.trunc(Number(t.value)||0);else return;save(KEY,state.prefs);document.body.classList.toggle('reduce-motion',state.prefs.reduceMotion);if(t.id==='reduce-motion')A.mountAll();}
document.addEventListener('click',action);document.addEventListener('change',settingsChanged);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-action=open]')){e.preventDefault();navigate('machine/'+e.target.dataset.id);}});window.addEventListener('hashchange',render);document.body.classList.toggle('reduce-motion',state.prefs.reduceMotion);updateClock();setInterval(updateClock,30000);render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();

</script>

<script>
(function(){
  'use strict';
  const key='the-array:visual-identity:v2';
  const permitted=new Set(['core','ghost','gold']);
  let saved='core';try{saved=localStorage.getItem(key)||'core';}catch(e){}
  function setIdentity(next){const mode=permitted.has(next)?next:'core';document.body.dataset.brandMode=mode;try{localStorage.setItem(key,mode);}catch(e){}
    document.querySelectorAll('[data-brand-mode].brand-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.brandMode===mode)));
  }
  setIdentity(saved);
  document.addEventListener('click',event=>{const button=event.target.closest('button.brand-choice[data-brand-mode]');if(button)setIdentity(button.dataset.brandMode);});
  const intro=document.getElementById('array-intro');if(!intro)return;
  const motion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let seen=false;try{seen=sessionStorage.getItem('the-array:intro:v2')==='1';}catch(e){}
  if(seen||motion)return;
  intro.hidden=false;
  let ended=false;
  function finish(){if(ended)return;ended=true;try{sessionStorage.setItem('the-array:intro:v2','1');}catch(e){}
    intro.hidden=true;document.getElementById('intro-skip')?.removeEventListener('click',finish);
  }
  document.getElementById('intro-skip')?.addEventListener('click',finish);
  const timeout=setTimeout(finish,2700);
  window.addEventListener('pagehide',()=>{clearTimeout(timeout);finish();},{once:true});
})();
</script>
